<VirtualHost *:80>
    ServerName senarath.lab
    DocumentRoot /var/www/html

    # Custom access-log format with response time (%D microseconds).
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %D" senarath_combined

    # Log INSIDE the vhost so these win over the stock defaults and actually
    # write into the shared /var/log/senarath directory (bind-mounted to host).
    CustomLog /var/log/senarath/apache_access.log senarath_combined
    ErrorLog  /var/log/senarath/apache_error.log

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
