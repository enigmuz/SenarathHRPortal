# Mirror Apache logs into the shared SIEM log directory so the CrowdStrike
# collector can tail raw HTTP telemetry (GET-based SQLi payloads show up in the
# query string here). The default stdout/stderr logging stays in place too.
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %D" senarath_combined
CustomLog /var/log/senarath/apache_access.log senarath_combined
ErrorLog  /var/log/senarath/apache_error.log
