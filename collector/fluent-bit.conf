# =============================================================================
#  Fluent Bit  —  alternative collector for the Senarath Bank HR lab
# =============================================================================
#  Use this if you prefer Fluent Bit over the Falcon LogScale Collector.
#  It tails the portal logs and POSTs them to LogScale's HEC-compatible
#  ingest endpoint (CrowdStrike NG-SIEM / Falcon LogScale).
#
#  Install:  sudo apt-get install fluent-bit   (or the td-agent-bit package)
#  Run:      fluent-bit -c /opt/senarath/collector/fluent-bit.conf
#
#  Fill in:
#    <LOGSCALE_HOST>   e.g. cloud.community.humio.com  (no scheme)
#    <INGEST_TOKEN>    ingest token for the target repo/view
#
#  The HEC endpoint used below is LogScale's HTTP Event Collector:
#    https://<LOGSCALE_HOST>/api/v1/ingest/hec/raw
#  Confirm the exact path/port for your tenant.
# =============================================================================

[SERVICE]
    flush         5
    daemon        off
    log_level     info
    parsers_file  parsers.conf

# --- Application security events (NDJSON, parsed into fields) ---------------
[INPUT]
    name              tail
    path              /opt/senarath/logs/app.log
    tag               senarath.app
    parser            senarath_json
    refresh_interval  5
    read_from_head    true

# --- Apache access log (raw lines) ------------------------------------------
[INPUT]
    name              tail
    path              /opt/senarath/logs/apache_access.log
    tag               senarath.apache
    refresh_interval  5
    read_from_head    true

[FILTER]
    name    record_modifier
    match   senarath.*
    record  source senarath-hr

[OUTPUT]
    name          http
    match         senarath.*
    host          <LOGSCALE_HOST>
    port          443
    tls           on
    uri           /api/v1/ingest/hec/raw
    format        json_lines
    header        Authorization Bearer <INGEST_TOKEN>
    json_date_key timestamp
